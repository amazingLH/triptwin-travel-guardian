[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triptwin"
version = "1.0.0"
description = "Evidence-grounded travel digital twin and guarded replanning agent"
requires-python = ">=3.11"
dependencies = [
  "gradio==6.29.1",
  "pydantic==2.14.1",
  "httpx[socks]==0.28.1",
  "python-dotenv==1.2.4",
  "Pillow==12.3.0",
]

[project.scripts]
triptwin = "triptwin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

